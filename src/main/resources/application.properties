server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

spring.application.name=plantify-backend

# Datasource configuration: Reads SPRING_DATASOURCE_URL from Render env vars or falls back to H2
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:plantifydb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Disable SQL script init runner to prevent schema timing conflicts (DataInitializer handles seeding)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# Hikari Connection Pool settings for Production & Aiven
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate Configuration & Speed Optimizations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# H2 Console (available at /h2-console when running in-memory mode)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
plantify.app.jwtExpirationMs=86400000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:secret_placeholder}
